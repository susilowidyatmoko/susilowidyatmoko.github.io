title: Susilo Widyatmoko
description: Bridge engineer and shell finite-element researcher — balanced-cantilever construction engineering, post-tensioning, plate and shell elements.
url: https://susilowidyatmoko.github.io
baseurl: ""
lang: en

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, nav: personal, permalink: "/writing/:year/:title/" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - personal.html   # personal
  - writing.html    # personal
  - _posts          # personal

# Personal section (journey + writing) is not published yet.
# To publish: set personal_ready: true and delete the three lines marked "personal" under exclude.
personal_ready: false
